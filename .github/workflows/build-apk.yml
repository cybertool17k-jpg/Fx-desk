name: Build FX Desk Android APK

on:
  push:
    branches: [main]
    paths:
      - "fx-desk-android-project.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Accept Android SDK license and install build packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack Android project
        run: unzip -q fx-desk-android-project.zip -d fx-desk-android

      - name: Build debug APK
        run: gradle --no-daemon -p fx-desk-android assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fx-desk-debug-apk
          path: fx-desk-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
